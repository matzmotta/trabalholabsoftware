<title>FemmeTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap">
<style>
/* Layout: moldura de celular centralizada; cabeçalho e barra inferior fixos, conteúdo rola no meio. Identidade visual do documento do projeto. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --sage:#99BCAC; --rose:#D49B91; --lilac:#A78BFA; --purple:#7C3AED;
  --gray:#5A5A5A; --ink:#2D2D2D; --btn1:#99BCA6; --btn2:#CDCDCD; --btn-text:#192A3C; --line:#ECE7EA;
  --rose-soft:#F7E9E6; --sage-soft:#E4EFE9; --lilac-soft:#EEE8FE; --danger:#B4443A; --desk:#EFEAF1;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(124,58,237,.12)}}
.hdr{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr h1{flex:1;margin:0;font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{flex:1;font-size:20px;font-weight:500;background:linear-gradient(90deg,var(--rose),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2px}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--gray);flex:none}
.icon-btn:hover{background:var(--lilac-soft);color:var(--purple)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor}
.main{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gray);font-size:12px;font-weight:300;cursor:pointer;min-width:0}
.nav button.on{color:var(--purple);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tap{cursor:pointer}.card.tap:hover{border-color:var(--lilac)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:500;margin:0}
.muted{color:var(--gray);font-size:12px;font-weight:300}
.sub{color:var(--gray)}
.small{font-size:12px;font-weight:300}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.btn{height:40px;min-width:88px;padding:12px;border:0;border-radius:8px;background:var(--btn1);color:var(--btn-text);font-size:16px;font-weight:300;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1}
.btn:hover{filter:brightness(.96)}
.btn.sec2{background:var(--btn2)}
.btn.block{width:100%}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:34px;font-size:14px;padding:8px 12px}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:400;background:var(--lilac-soft);color:#5B21B6;white-space:nowrap}
.chip.menstrual{background:var(--rose-soft);color:#8A4A3F}.chip.folicular{background:var(--sage-soft);color:#3E6655}.chip.ovulatoria{background:var(--lilac-soft);color:#5B21B6}.chip.lutea{background:#ECECEC;color:#444}
.chip.ok{background:var(--sage-soft);color:#2F5A47}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:300;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:400}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:40px;color:var(--gray)}
.search input{flex:1;border:0;background:none;outline:0;height:100%;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--purple));border-radius:99px}
.bar.over>i{background:var(--rose)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.macro b{display:block;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.empty{text-align:center;color:var(--gray);padding:22px 10px;border:1px dashed var(--btn2);border-radius:12px;font-weight:300}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.switch{position:relative;width:44px;height:26px;flex:none;border:0;border-radius:99px;background:var(--btn2);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--purple)}.switch.on::after{left:21px}
.heart{color:var(--rose)}
.heart.on{color:var(--purple)}
.days{display:flex;gap:4px}
.days span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--bg);color:#999}
.days span.on{background:var(--lilac-soft);color:var(--purple);font-weight:500}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.half{background:var(--lilac)}.dots i.full{background:var(--sage)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--btn2);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0;color:#fff}
.check.on{background:var(--sage);border-color:var(--sage)}
.list-plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pre{white-space:pre-line}
/* auth */
.auth{flex:1;overflow-y:auto;padding:16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.auth img{width:200px;max-width:70%;align-self:center;mix-blend-mode:multiply}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;height:36px;border-radius:8px;font-weight:300;cursor:pointer}
.seg button.on{background:var(--surface);font-weight:500;color:var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* forms */
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.f{grid-column:span 6;display:flex;flex-direction:column;gap:4px;min-width:0}
.f.s3{grid-column:span 3}.f.s2{grid-column:span 2}.f.s4{grid-column:span 4}
.f label{font-size:12px;color:var(--gray);font-weight:400}
.f input,.f select,.f textarea{height:40px;padding:0 10px;border:1px solid #D9D3D7;border-radius:8px;background:#fff;min-width:0;width:100%}
.f textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
.f.cb{flex-direction:row;align-items:center;gap:8px}.f.cb input{width:20px;height:20px}
.dayp{display:flex;gap:6px;flex-wrap:wrap}
.dayp label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink)}
.dayp input{width:18px;height:18px}
.err{background:#FBE9E7;color:#8C2F26;border-radius:8px;padding:8px 10px;font-size:13px}
.err:empty{display:none}
.modal{position:absolute;inset:0;background:rgba(45,45,45,.45);display:flex;align-items:flex-end;z-index:30}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:40;max-width:90%;text-align:center}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;width:100%;text-align:left;border-width:1px}
.menu-item:hover{border-color:var(--lilac)}
.hint{background:var(--lilac-soft);color:#4C1D95;border-radius:8px;padding:8px 10px;font-size:12px}
.pct{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const food=id=>T("alimento").find(a=>a.id_alimento==id);
const itemsOf=rid=>T("item_registro_alimentar").filter(i=>i.id_registro==rid);
function nut(items){return items.reduce((s,i)=>{const a=food(i.id_alimento);if(!a)return s;const f=i.quantidade_g/100;s.k+=a.calorias_100g*f;s.p+=a.proteinas_100g*f;s.c+=a.carboidratos_100g*f;s.g+=a.gorduras_100g*f;return s},{k:0,p:0,c:0,g:0})}
function recalcCycles(uid){const cs=T("ciclo_menstrual").filter(c=>c.id_usuaria==uid).sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio));
  cs.forEach((c,i)=>{const nx=cs[i+1];if(nx){const d=diffDays(c.data_inicio,nx.data_inicio);c.duracao_ciclo_dias=d>=15&&d<=60?d:null}else c.duracao_ciclo_dias=null})}
function cyclesOf(u){return T("ciclo_menstrual").filter(c=>c.id_usuaria==u.id_usuaria).sort((a,b)=>b.data_inicio.localeCompare(a.data_inicio))}
function phase(u){const c=cyclesOf(u)[0];if(!c)return null;const day=diffDays(c.data_inicio,today())+1;if(day>60)return{day,fase:null};
  return{day,fase:day<=5?"menstrual":day<=13?"folicular":day<=16?"ovulatoria":"lutea"}}
const chip=(f)=>f?`<span class="chip ${f}">${FASE[f]}</span>`:"";
function recCalc(recId){const r=T("receita").find(x=>x.id_receita==recId);let k=0;T("ingrediente_receita").filter(i=>i.id_receita==recId).forEach(i=>{if(i.unidade==="g"||i.unidade==="ml"){const a=food(i.id_alimento);if(a)k+=a.calorias_100g*i.quantidade/100}});return k?Math.round(k/r.porcoes):r.calorias_porcao}

function fieldHTML(f,v){
  const val=v[f.n]??f.def??"";const id="f_"+f.n;const span=f.s?" s"+f.s:"";
  if(f.t==="checkbox")return `<div class="f cb${span}"><input type="checkbox" id="${id}" name="${f.n}" ${v[f.n]?"checked":""}><label for="${id}">${esc(f.l)}</label></div>`;
  if(f.t==="days"){const s=String(v[f.n]||"0111110");return `<div class="f"><label>${esc(f.l)}</label><div class="dayp">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map((d,i)=>`<label><input type="checkbox" name="d${i}" ${s[i]==="1"?"checked":""}>${d}</label>`).join("")}</div></div>`}
  let ctl="";
  if(f.t==="select")ctl=`<select id="${id}" name="${f.n}" ${f.req?"required":""}>${f.blank?`<option value="">${esc(f.blank)}</option>`:""}${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if(f.t==="textarea")ctl=`<textarea id="${id}" name="${f.n}" ${f.req?"required":""} placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>`;
  else ctl=`<input id="${id}" name="${f.n}" type="${f.t||"text"}" value="${esc(val)}" ${f.req?"required":""} ${(f.min??(f.t==="date"?"2000-01-01":null))!=null?`min="${f.min??"2000-01-01"}"`:""} ${(f.max??(f.t==="date"?"2100-12-31":null))!=null?`max="${f.max??"2100-12-31"}"`:""} ${f.step?`step="${f.step}"`:""} placeholder="${esc(f.ph||"")}" ${f.t==="password"?'autocomplete="new-password"':""}>`;
  return `<div class="f${span}"><label for="${id}">${esc(f.l)}${f.req?" *":""}</label>${ctl}</div>`;
}
function openForm({title,fields,values={},submit="Salvar",onSubmit,note}){ui.modal={kind:"form",title,fields,values,submit,onSubmit,note};renderModal()}
function confirmBox(msg,onYes,label="Excluir"){ui.modal={kind:"confirm",msg,onYes,label};renderModal()}
function closeModal(){ui.modal=null;renderModal()}
function renderModal(){
  let el=$("#modal");const m=ui.modal;
  if(!m){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="modal";el.className="modal";$("#app").appendChild(el)}
  if(m.kind==="confirm"){el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h2>Confirmar</h2><p style="margin:0">${esc(m.msg)}</p><div class="row"><button class="btn sec2 grow" data-act="closeModal">Cancelar</button><button class="btn danger grow" data-act="confirmYes">${esc(m.label)}</button></div></div>`;return}
  el.innerHTML=`<form class="sheet" id="mform" role="dialog" aria-modal="true" novalidate><div class="row sb"><h2>${esc(m.title)}</h2><button type="button" class="icon-btn" data-act="closeModal" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${m.note?`<div class="hint">${esc(m.note)}</div>`:""}<div class="form">${m.fields.map(f=>fieldHTML(f,m.values)).join("")}</div><div class="err" id="ferr" role="alert"></div><div class="row"><button type="button" class="btn sec2 grow" data-act="closeModal">Cancelar</button><button type="submit" class="btn grow">${esc(m.submit)}</button></div></form>`;
  el.querySelector("input:not([type=checkbox]),select,textarea")?.focus();
}
async function handleForm(form){
  if(form.id==="mform"){const m=ui.modal;const fd=new FormData(form);const vals={};
    for(const f of m.fields){
      if(f.t==="checkbox")vals[f.n]=fd.has(f.n);
      else if(f.t==="days"){vals[f.n]=[0,1,2,3,4,5,6].map(i=>fd.has("d"+i)?"1":"0").join("")}
      else{let v=(fd.get(f.n)??"").toString().trim();if(f.t==="number")v=v===""?null:parseFloat(v.replace(",","."));vals[f.n]=v;
        const inp=form.querySelector("#f_"+f.n);
        if(f.t==="date"&&inp&&inp.validity.badInput){$("#ferr").textContent=`A data de "${f.l}" é inválida ou está incompleta. Confira se o dia existe no mês (novembro, por exemplo, tem só 30 dias).`;return}
        if(f.t==="date"&&v&&(v<"2000-01-01"||v>"2100-12-31")){$("#ferr").textContent=`Confira o ano da data de "${f.l}".`;return}
        if(f.req&&(v===""||v===null||Number.isNaN(v))){$("#ferr").textContent=`Preencha o campo "${f.l}".`;return}}
    }
    const err=await m.onSubmit(vals);
    if(err){const x=$("#ferr");if(x)x.textContent=err}else{ui.modal=null;renderModal();persist();render()}
  }
  if(form.dataset.form==="login"){doLogin(new FormData(form))}
  if(form.dataset.form==="signup"){doSignup(new FormData(form))}
}
document.addEventListener("submit",e=>{e.preventDefault();handleForm(e.target)});

async function doSignup(fd){

  if(senha.length<6){err.textContent="A senha precisa ter pelo menos 6 caracteres.";return}

  const id=nextId("usuaria");

function vRefeicao(p){

function render(){

  const left=root?`<div class="brand">${admin?"FemmeTrack · Admin":"FemmeTrack"}</div>`:`<button class="icon-btn" data-act="back" aria-label="Voltar">${svg("back")}</button><h1>${TITLES[r.name]||""}</h1>`;
  const right=admin?`<button class="icon-btn" data-act="logout" aria-label="Sair">${svg("out")}</button>`:`<button class="icon-btn" data-act="go" data-to="lembretes" aria-label="Lembretes e notificações">${svg("bell")}</button>`;
  const tabs=admin?ATABS:TABS;
  const activeTab=admin?r.name:(["diario","refeicao"].includes(r.name)?"diario":["receitas","receita"].includes(r.name)?"receitas":["planos","plano"].includes(r.name)?"planos":r.name==="habitos"?"habitos":"mais");
  const title=root&&!admin&&r.name!=="diario"?`<h1>${TITLES[r.name]}</h1>`:"";
  app.innerHTML=`<div class="hdr">${left}${right}</div><main class="main" id="main">${view?view():""}</main>
  <nav class="nav" aria-label="Navegação principal">${tabs.map(t=>`<button class="${activeTab===t[0]?"on":""}" data-act="tab" data-to="${t[0]}" ${activeTab===t[0]?'aria-current="page"':""}>${svg(t[1])}<span>${t[2]}</span></button>`).join("")}</nav>
  ${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:""}`;
  if(ui.modal)renderModal();
}

function launchDiary(i){
  if(i.diario_itens)return true;
  const p=T("planejamento_refeicao").find(x=>x.id_planejamento==i.id_planejamento);const r=T("receita").find(x=>x.id_receita==i.id_receita);
  const ing=T("ingrediente_receita").filter(x=>x.id_receita==i.id_receita&&(x.unidade==="g"||x.unidade==="ml"));
  if(!p||!r||!ing.length)return false;
  const reg=ensureReg(p.id_usuaria,i.tipo_refeicao,i.data_prevista);const added=[];
  ing.forEach(x=>{const q=Math.round(x.quantidade/r.porcoes*10)/10;const ex=T("item_registro_alimentar").find(y=>y.id_registro==reg.id_registro&&y.id_alimento==x.id_alimento);
    if(ex)ex.quantidade_g=Math.round((ex.quantidade_g+q)*10)/10;else T("item_registro_alimentar").push({id_registro:reg.id_registro,id_alimento:x.id_alimento,quantidade_g:q});added.push({id_alimento:x.id_alimento,q})});
  const tag="Planejado: "+r.titulo;reg.observacao=reg.observacao?reg.observacao+" · "+tag:tag;
  i.id_registro_diario=reg.id_registro;i.diario_itens=added;i.diario_tag=tag;return true}
function unlaunchDiary(i){
  const reg=T("registro_alimentar").find(x=>x.id_registro==i.id_registro_diario);
  if(reg&&i.diario_itens){i.diario_itens.forEach(a=>{const ex=T("item_registro_alimentar").find(y=>y.id_registro==reg.id_registro&&y.id_alimento==a.id_alimento);
      if(ex){ex.quantidade_g=Math.round((ex.quantidade_g-a.q)*10)/10;if(ex.quantidade_g<=0.05)db.t.item_registro_alimentar=T("item_registro_alimentar").filter(y=>y!==ex)}});
    if(i.diario_tag&&reg.observacao)reg.observacao=reg.observacao.split(" · ").filter(t=>t!==i.diario_tag).join(" · ");
    if(!itemsOf(reg.id_registro).length&&!reg.observacao&&!reg.horario)db.t.registro_alimentar=T("registro_alimentar").filter(y=>y!==reg)}
  i.id_registro_diario=null;i.diario_itens=null;i.diario_tag=null}
function addRecipeToDiary(uid,rid,date,tipo,por){
  const r=T("receita").find(x=>x.id_receita==rid);const ing=T("ingrediente_receita").filter(x=>x.id_receita==rid);
  const ok=ing.filter(x=>x.unidade==="g"||x.unidade==="ml");
  if(!r||!ok.length)return {err:"Esta receita não tem ingredientes em g ou ml para lançar no diário."};
  const reg=ensureReg(uid,tipo,date);
  ok.forEach(x=>{const q=Math.round(x.quantidade/r.porcoes*por*10)/10;const ex=T("item_registro_alimentar").find(y=>y.id_registro==reg.id_registro&&y.id_alimento==x.id_alimento);
    if(ex)ex.quantidade_g=Math.round((ex.quantidade_g+q)*10)/10;else T("item_registro_alimentar").push({id_registro:reg.id_registro,id_alimento:x.id_alimento,quantidade_g:q})});
  return {skipped:ing.length-ok.length}}
function addPlanItem(pid,rid,date,tipo){const p=T("planejamento_refeicao").find(x=>x.id_planejamento==pid);
  if(date<p.data_inicio||date>p.data_fim)return `A data deve estar entre ${br(p.data_inicio)} e ${br(p.data_fim)}.`;
  T("item_planejamento").push({id_item:nextId("item_planejamento"),id_planejamento:pid,id_receita:rid,data_prevista:date,tipo_refeicao:tipo,realizada:false});toast("Receita incluída no planejamento")}

function cycleSave(c,v){const uid=me().id_usuaria;
  if(v.i>today())return "O início do ciclo não pode ser uma data futura.";
  if(v.f&&v.f<v.i)return "O término não pode ser anterior ao início.";if(v.f&&diffDays(v.i,v.f)+1>15)return "A menstruação não costuma passar de 15 dias. Confira as datas.";
  const others=T("ciclo_menstrual").filter(x=>x.id_usuaria==uid&&x!==c);
  const nx=others.filter(x=>x.data_inicio>v.i).sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio))[0];
  if(v.f&&nx&&v.f>=nx.data_inicio)return `O término deve ser antes do início do ciclo seguinte (${br(nx.data_inicio)}).`;
  const pv=others.filter(x=>x.data_inicio<v.i).sort((a,b)=>b.data_inicio.localeCompare(a.data_inicio))[0];
  if(pv&&pv.data_fim_menstruacao&&pv.data_fim_menstruacao>=v.i)return `O ciclo anterior terminou em ${br(pv.data_fim_menstruacao)}, depois deste início. Confira as datas.`;
  if(T("ciclo_menstrual").some(x=>x.id_usuaria==uid&&x.data_inicio===v.i&&x!==c))return "Já existe um ciclo com esse início.";
  if(c){c.data_inicio=v.i;c.data_fim_menstruacao=v.f||null}else T("ciclo_menstrual").push({id_ciclo:nextId("ciclo_menstrual"),id_usuaria:uid,data_inicio:v.i,data_fim_menstruacao:v.f||null,duracao_ciclo_dias:null});
  recalcCycles(uid)}
function foodForm(a){openForm({title:a?"Editar alimento":"Novo alimento",fields:[{n:"nome",l:"Nome",req:1},{n:"cat",l:"Categoria",req:1,ph:"Ex.: Frutas"},{n:"k",l:"Calorias (100 g)",t:"number",min:0,step:"any",req:1,s:3},{n:"p",l:"Proteínas (g)",t:"number",min:0,step:"any",req:1,s:3},{n:"c",l:"Carboidratos (g)",t:"number",min:0,step:"any",req:1,s:3},{n:"g",l:"Gorduras (g)",t:"number",min:0,step:"any",req:1,s:3}],values:a?{nome:a.nome,cat:a.categoria,k:a.calorias_100g,p:a.proteinas_100g,c:a.carboidratos_100g,g:a.gorduras_100g}:{},onSubmit:v=>{
  if([v.k,v.p,v.c,v.g].some(x=>x<0))return "Os valores nutricionais não podem ser negativos.";
  if(T("alimento").some(x=>x.nome.toLowerCase()===v.nome.toLowerCase()&&x!==a))return "Já existe um alimento com esse nome.";
  const o={nome:v.nome,categoria:v.cat,calorias_100g:v.k,proteinas_100g:v.p,carboidratos_100g:v.c,gorduras_100g:v.g};
  if(a){Object.assign(a,o);T("receita").forEach(r=>{r.calorias_porcao=recCalc(r.id_receita)})}else T("alimento").push({id_alimento:nextId("alimento"),...o})}})}
function recipeForm(r){
  const al=T("alimento").slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(a=>[a.id_alimento,a.nome]);
  const ing=r?T("ingrediente_receita").filter(i=>i.id_receita==r.id_receita):[];const vals=r?{titulo:r.titulo,desc:r.descricao,modo:r.modo_preparo,tempo:r.tempo_preparo_min,por:r.porcoes,cat:r.categoria,fase:r.fase_ciclo_indicada||""}:{por:1,cat:"prato_principal"};
  const fields=[{n:"titulo",l:"Título",req:1},{n:"desc",l:"Descrição"},{n:"modo",l:"Modo de preparo",t:"textarea",req:1},{n:"tempo",l:"Tempo (min)",t:"number",min:1,req:1,s:2},{n:"por",l:"Porções",t:"number",min:1,req:1,s:2},{n:"cat",l:"Categoria",t:"select",opts:opts(RCAT),req:1,s:2},{n:"fase",l:"Fase do ciclo indicada",t:"select",opts:opts(FASE),blank:"Nenhuma"}].filter(f=>!["modo","tempo","por","cat"].includes(f.n));
  for(let k=0;k<8;k++){const i=ing[k];vals["a"+k]=i?i.id_alimento:"";vals["q"+k]=i?i.quantidade:"";vals["u"+k]=i?i.unidade:"g";
    fields.push({n:"a"+k,l:`Ingrediente ${k+1}`,t:"select",opts:al,blank:"—",s:4},{n:"q"+k,l:"Qtd.",t:"number",min:0,step:"any",s:1},{n:"u"+k,l:"Un.",t:"select",opts:opts(UNID),s:1})}
  openForm({title:r?"Editar receita":"Nova receita",fields,values:vals,note:"Informe o nome e os ingredientes. As calorias são somadas automaticamente pelos ingredientes em g ou ml.",onSubmit:v=>{
    const list=[];const seen=new Set();for(let k=0;k<8;k++){if(v["a"+k]){if(!(v["q"+k]>0))return `Informe a quantidade do ingrediente ${k+1}.`;if(seen.has(v["a"+k]))return "Há ingredientes repetidos.";seen.add(v["a"+k]);list.push({id_alimento:+v["a"+k],quantidade:v["q"+k],unidade:v["u"+k]})}}
    if(!list.length)return "Inclua pelo menos um ingrediente.";
    let rec=r;const o={titulo:v.titulo,descricao:v.desc,fase_ciclo_indicada:v.fase||null};
    if(rec)Object.assign(rec,o);else{rec={id_receita:nextId("receita"),id_usuaria:isAdmin()?null:me().id_usuaria,calorias_porcao:null,modo_preparo:"",tempo_preparo_min:null,porcoes:1,categoria:null,...o};T("receita").push(rec)}
    db.t.ingrediente_receita=T("ingrediente_receita").filter(i=>i.id_receita!=rec.id_receita).concat(list.map(i=>({id_receita:rec.id_receita,...i})));
    rec.calorias_porcao=recCalc(rec.id_receita)}})}
